<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gemini Web Tool Calling</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: system-ui, sans-serif;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 3rem 1rem;
            }
            #container {
                width: 100%;
                max-width: 900px;
                display: flex;
                flex-direction: column;
                border: 1px solid #e0e0e0;
            }
            #messages {
                overflow-y: auto;
                padding: 2rem;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                min-height: 450px;
                max-height: 70vh;
            }
            .msg {
                line-height: 1.5;
                max-width: 80%;
            }
            .msg.user {
                align-self: flex-end;
                text-align: right;
            }
            .msg .role {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #999;
                margin-bottom: 0.25rem;
            }
            .msg.loading .content {
                color: #999;
            }
            #input-area {
                display: flex;
                gap: 1rem;
                padding: 1.5rem;
                border-top: 1px solid #e0e0e0;
            }
            #user-input {
                flex: 1;
                padding: 0.75rem 0;
                border: none;
                border-bottom: 1px solid #e0e0e0;
                font-size: 1rem;
                outline: none;
            }
            #user-input:focus {
                border-bottom-color: #000;
            }
            button {
                padding: 0.75rem 1.5rem;
                background: #000;
                color: #fff;
                border: none;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                cursor: pointer;
            }

            /* Generic amber tool-call block */
            .tool {
                font-family: ui-monospace, monospace;
                font-size: 0.75rem;
                color: #555;
                background: #f5f5f5;
                border-left: 3px solid #f59e0b;
                padding: 0.5rem 0.75rem;
                margin: 0.25rem 0 0.75rem;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .tool .label {
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #b45309;
            }

            /* Film poster grid (show_films) */
            .film-grid-wrapper {
                border-left: 3px solid #f59e0b;
                margin: 0.25rem 0 0.75rem;
            }
            .film-grid-header {
                font-family: ui-monospace, monospace;
                font-size: 0.75rem;
                color: #b45309;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                background: #f5f5f5;
                padding: 0.5rem 0.75rem;
            }
            .film-grid {
                display: flex;
                flex-direction: row;
                gap: 0.75rem;
                overflow-x: auto;
                padding: 0.75rem;
                background: #fafafa;
            }
            .film-card {
                flex: 0 0 110px;
                display: flex;
                flex-direction: column;
                gap: 0.35rem;
            }
            .film-poster {
                width: 110px;
                height: 165px;
                background: #e0e0e0;
                overflow: hidden;
                border-radius: 2px;
                flex-shrink: 0;
            }
            .film-poster img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .film-poster.no-poster {
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                font-size: 0.6rem;
                color: #888;
                padding: 0.4rem;
            }
            .film-info {
                display: flex;
                flex-direction: column;
                gap: 0.15rem;
            }
            .film-title {
                font-size: 0.68rem;
                font-weight: 600;
                line-height: 1.3;
            }
            .film-meta {
                font-size: 0.6rem;
                color: #999;
            }
            .provider-logos {
                display: flex;
                flex-wrap: wrap;
                gap: 3px;
                margin-top: 2px;
            }
            .provider-logos img {
                width: 22px;
                height: 22px;
                border-radius: 4px;
                object-fit: cover;
            }

            button:disabled {
                opacity: 0.3;
            }
            #attribution {
                font-size: 0.7rem;
                color: #aaa;
                text-align: center;
                padding: 0.5rem 1.5rem;
                border-top: 1px solid #f0f0f0;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div id="messages"></div>
            <div id="attribution">
                This product uses the TMDB API but is not endorsed or certified by TMDB. Streaming data from JustWatch.
            </div>
            <div id="input-area">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Type a message..."
                    autocomplete="off"
                />
                <button id="send-btn">Send</button>
            </div>
        </div>
        <script>
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            let sessionId = null;

            function addMessage(role, text, isLoading = false) {
                const div = document.createElement("div");
                div.className =
                    "msg " +
                    (role === "you" ? "user" : "assistant") +
                    (isLoading ? " loading" : "");
                div.innerHTML =
                    '<div class="role">' +
                    role +
                    '</div><div class="content">' +
                    text +
                    "</div>";
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                return div;
            }

            // Build one poster card for a show_films film entry.
            function renderFilmCard(film) {
                const card = document.createElement("div");
                card.className = "film-card";

                // Poster image or placeholder
                const posterDiv = document.createElement("div");
                posterDiv.className = "film-poster";
                if (film.poster_url) {
                    const img = document.createElement("img");
                    img.src = film.poster_url;
                    img.alt = film.title || "";
                    img.loading = "lazy";
                    posterDiv.appendChild(img);
                } else {
                    posterDiv.classList.add("no-poster");
                    posterDiv.textContent = film.title || "?";
                }
                card.appendChild(posterDiv);

                // Text info below the poster
                const info = document.createElement("div");
                info.className = "film-info";

                const titleEl = document.createElement("div");
                titleEl.className = "film-title";
                titleEl.textContent =
                    (film.title || "Unknown") + (film.year ? ` (${film.year})` : "");
                info.appendChild(titleEl);

                if (film.runtime) {
                    const meta = document.createElement("div");
                    meta.className = "film-meta";
                    meta.textContent = film.runtime + " min";
                    info.appendChild(meta);
                }

                // Stream provider logos if cached (up to 5)
                const streamers = film.stream || [];
                if (streamers.length > 0) {
                    const logosDiv = document.createElement("div");
                    logosDiv.className = "provider-logos";
                    for (const p of streamers.slice(0, 5)) {
                        if (p.logo_url) {
                            const img = document.createElement("img");
                            img.src = p.logo_url;
                            img.alt = p.name;
                            img.title = p.name;
                            logosDiv.appendChild(img);
                        }
                    }
                    if (logosDiv.hasChildNodes()) {
                        info.appendChild(logosDiv);
                    }
                }

                card.appendChild(info);
                return card;
            }

            // Build the film grid element for a show_films tool call.
            function renderFilmGrid(call) {
                let parsed;
                try {
                    parsed = JSON.parse(call.result);
                } catch (_) {
                    return null;
                }

                const films = parsed.films || [];
                const wrapper = document.createElement("div");
                wrapper.className = "film-grid-wrapper";

                const header = document.createElement("div");
                header.className = "film-grid-header";
                header.textContent =
                    `tool call  show_films — ${parsed.displayed ?? films.length} films`;
                wrapper.appendChild(header);

                const grid = document.createElement("div");
                grid.className = "film-grid";
                for (const film of films) {
                    grid.appendChild(renderFilmCard(film));
                }
                wrapper.appendChild(grid);
                return wrapper;
            }

            async function send() {
                const text = userInput.value.trim();
                if (!text) return;

                userInput.value = "";
                sendBtn.disabled = true;
                addMessage("you", text);
                const loading = addMessage("assistant", "Thinking...", true);

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: text,
                            session_id: sessionId,
                        }),
                    });
                    const data = await res.json();
                    sessionId = data.session_id;

                    // Render each tool call above the assistant's answer.
                    // show_films → poster grid; everything else → amber code block.
                    for (const call of data.tool_calls || []) {
                        let el = null;
                        if (call.name === "show_films") {
                            el = renderFilmGrid(call);
                        }
                        if (!el) {
                            el = document.createElement("div");
                            el.className = "tool";
                            const label = document.createElement("span");
                            label.className = "label";
                            label.textContent = "tool call  ";
                            el.appendChild(label);
                            el.appendChild(
                                document.createTextNode(
                                    call.name +
                                        "(" +
                                        JSON.stringify(call.args) +
                                        ")\n→ " +
                                        call.result,
                                ),
                            );
                        }
                        messages.insertBefore(el, loading);
                    }

                    loading.querySelector(".content").textContent = data.response;
                    loading.classList.remove("loading");
                } catch (e) {
                    loading.querySelector(".content").textContent = "Error: " + e.message;
                    loading.classList.remove("loading");
                }
                sendBtn.disabled = false;
                userInput.focus();
            }

            sendBtn.addEventListener("click", send);
            userInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") send();
            });
            userInput.focus();
        </script>
    </body>
</html>
